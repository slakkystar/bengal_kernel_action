name: Build Kernel
on:
  workflow_dispatch:
    inputs:
      REPO:
        description: 'Kernel repository'
        default: 'slakkystar/kernel_xiaomi_citrus_sm6115'
        required: true
      BRANCH:
        description: 'Kernel branch'
        default: 'main'
        required: true
      DEVICE_TARGET:
        description: 'Device to build'
        type: string
        default: 'chime'
        required: true
      KSU:
        description: 'Add KernelSU support'
        type: boolean
        default: true
      SUSFS:
        description: 'Add SuSFS support'
        type: boolean
        default: true
      OPLUS:
        description: 'Oplus build'
        type: boolean
        default: true
      APPLY_WORKAROUND:
        description: 'Disable Thermal Configs'
        type: boolean
        default: false
      BUILD_RELEASE:
        description: 'Build non-nightly'
        type: boolean
        default: false
      UPDATE_TOOLCHAIN:
        description: 'Force update toolchain cache'
        type: boolean
        default: false
      KCFLAGS_W:
        description: 'Enable KCFLAGS=-w'
        type: boolean
        default: true
      TOOLCHAIN_BRANCH:
        description: 'AOSP clang branch'
        type: string
        default: 'android17-release'
      TOOLCHAIN_DIR_NAME:
        description: 'AOSP clang directory'
        type: string
        default: 'clang-r596125'
      UPLOAD_RELEASE:
        description: 'Upload final zip to GitHub Releases'
        type: boolean
        default: false
      UPLOAD_TELEGRAM:
        description: 'Upload artifacts to Telegram'
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Set Timezone
      run: sudo ln -sf /usr/share/zoneinfo/Asia/Jakarta /etc/localtime

    - uses: actions/checkout@v5
      with:
        fetch-depth: 1

    - name: Clone kernel source
      if: ${{ !inputs.UPDATE_TOOLCHAIN }}
      run: git clone --single-branch -b ${{ inputs.BRANCH }} https://github.com/${{ inputs.REPO }} kernel_root

    - name: Cache Toolchain
      id: cache-toolchain
      uses: actions/cache@v5
      with:
        path: ~/clang-22
        key: toolchain-${{ inputs.TOOLCHAIN_BRANCH }}-${{ inputs.TOOLCHAIN_DIR_NAME }}-v1

    - name: Cache ccache
      uses: actions/cache@v5
      with:
        path: ~/.ccache
        key: ccache-kernel-${{ github.sha }}
        restore-keys: ccache-kernel-

    - name: Prepare Dependencies
      run: chmod +x ./build.sh && bash ./build.sh --setup-deps

    - name: Setup Build Environment
      if: ${{ !inputs.UPDATE_TOOLCHAIN }}
      id: buildKernel
      run: |
        cd kernel_root
        KERNELCODE=$(cat ../codename 2>/dev/null || echo "kernel")
        echo "KERNELCODE=$KERNELCODE" >> $GITHUB_ENV

    - name: Fetch Toolchains
      if: ${{ steps.cache-toolchain.outputs.cache-hit != 'true' || inputs.UPDATE_TOOLCHAIN }}
      env:
        UPDATE_TOOLCHAINS: ${{ inputs.UPDATE_TOOLCHAIN }}
        TOOLCHAIN_BRANCH: ${{ inputs.TOOLCHAIN_BRANCH }}
        TOOLCHAIN_DIR_NAME: ${{ inputs.TOOLCHAIN_DIR_NAME }}
      run: bash ./build.sh --fetch-toolchains

    - name: Build Kernel
      if: ${{ !inputs.UPDATE_TOOLCHAIN }}
      env:
        DEVICE_TARGET: ${{ inputs.DEVICE_TARGET }}
        APPLY_WORKAROUND: ${{ inputs.APPLY_WORKAROUND }}
        KSU: ${{ inputs.KSU }}
        SUSFS: ${{ inputs.SUSFS }}
        OPLUS: "${{ inputs.OPLUS }}"
        KCFLAGS_W: "${{ inputs.KCFLAGS_W }}"
        CCACHE_SIZE: "7.5G"
        CLEAN_BUILD: "false"
      run: |
        if [ ! -d ~/.ccache ]; then
          mkdir -p ~/.ccache
        fi

        cd kernel_root

        if [[ "$KSU" == "true" ]]; then
          export IS_KSU_ENABLED=true
          curl -LSs "https://raw.githubusercontent.com/slakkystar/ReSukiSU/refs/heads/master/kernel/setup.sh" | bash -s master
        fi

        bash ../build.sh
        echo "<b>📋 Changelog:</b>" > changelog.txt
        git log -5 --pretty=format:"• <code>%H</code> - %s" >> changelog.txt

    - name: Upload kernel artifacts
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: Kernel-${{ inputs.DEVICE_TARGET }}
        include-hidden-files: true
        if-no-files-found: ignore
        path: |
          kernel_root/*.zip
          kernel_root/out/.config
          kernel_root/changelog.txt

    - name: Upload to GitHub Release
      if: ${{ inputs.UPLOAD_RELEASE && !inputs.UPDATE_TOOLCHAIN }}
      uses: softprops/action-gh-release@v2
      with:
        files: kernel_root/*.zip
        tag_name: "build-${{ github.run_number }}"
        name: "Kernel Build #${{ github.run_number }}"
        draft: false
        prerelease: ${{ !inputs.BUILD_RELEASE }}

  upload_tg:
    needs: build
    if: ${{ inputs.UPLOAD_TELEGRAM && !inputs.UPDATE_TOOLCHAIN }}
    uses: ./.github/workflows/upload.yml
    with:
      device: ${{ inputs.DEVICE_TARGET }}
    secrets: inherit
