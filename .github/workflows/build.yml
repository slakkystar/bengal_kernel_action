name: Build Kernel
on:
  workflow_dispatch:
    inputs:
      REPO:
        description: 'Kernel repository'
        default: 'slakkystar/kernel_xiaomi_citrus_sm6115'
        required: true
      BRANCH:
        description: 'Kernel branch'
        default: '13.0.0-perf'
        required: true
      DEVICE_TARGET:
        description: 'Device to build'
        default: 'chime'
        type: choice
        options: [chime, lime, citrus, bengal-perf, bengal-stock]
      KSU:
        description: 'Add KernelSU support'
        type: boolean
        default: false
      KSU_BRANCH:
        description: 'KernelSU branch'
        required: true
        default: 'main'
      APPLY_WORKAROUND:
        description: 'Disable Thermal Configs'
        type: boolean
        default: false
      BUILD_RELEASE:
        description: 'Build non-nightly'
        type: boolean
        default: false
      UPDATE_TOOLCHAIN:
        description: 'Force update toolchain cache'
        type: boolean
        default: false
      KCFLAGS_W:
        description: 'Enable KCFLAGS=-w'
        type: boolean
        default: false
      TOOLCHAIN_URL:
        description: 'Custom Clang toolchain URL (leave empty for default)'
        required: false
        default: ''
      CCACHE_SIZE:
        description: 'ccache max size (e.g., 5G, 10G)'
        required: false
        default: '5G'
      CLEAN_BUILD:
        description: 'Clean output before build'
        type: boolean
        default: false
      UPLOAD_RELEASE:
        description: 'Upload final zip to GitHub Releases'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Set Timezone
      run: sudo ln -sf /usr/share/zoneinfo/Asia/Jakarta /etc/localtime

    - uses: actions/checkout@v5
      with:
        fetch-depth: 1

    - name: Clone kernel source
      if: inputs.UPDATE_TOOLCHAIN != 'true'
      run: git clone --depth=1 --single-branch -b ${{ inputs.BRANCH }} https://github.com/${{ inputs.REPO }} kernel_root

    - name: Cache Toolchain
      id: cache-toolchain
      uses: actions/cache@v5
      with:
        path: ~/clang-22
        key: llvm-22-${{ hashFiles('**/TOOLCHAIN_URL') || 'default' }}

    - name: Cache ccache
      uses: actions/cache@v5
      with:
        path: ~/.ccache
        key: ccache-kernel-${{ github.sha }}
        restore-keys: ccache-kernel-

    - name: Prepare Dependencies
      run: chmod +x ./build.sh && bash ./build.sh --setup-deps

    - name: Setup Build Environment
      if: inputs.UPDATE_TOOLCHAIN != 'true'
      id: buildKernel
      run: |
        cd kernel_root
        gitsha1=$(git rev-parse --short HEAD)
        CODENAME=$(cat ../codename || echo "kernel")

        if [[ "${{ inputs.BUILD_RELEASE }}" = "false" ]]; then
          echo "buildDetails=$CODENAME-${{ inputs.DEVICE_TARGET }}-$(date +%Y%m%d)_${gitsha1}-NIGHTLY" >> $GITHUB_OUTPUT
        else
          echo "buildDetails=$CODENAME-${{ inputs.DEVICE_TARGET }}-$(date +%Y%m%d)_${gitsha1}" >> $GITHUB_OUTPUT
        fi
        echo "currDate=$(date)" >> $GITHUB_OUTPUT

    - name: Fetch Toolchains
      if: steps.cache-toolchain.outputs.cache-hit != 'true' || inputs.UPDATE_TOOLCHAIN == 'true'
      env:
        UPDATE_TOOLCHAINS: ${{ inputs.UPDATE_TOOLCHAIN }}
        TOOLCHAIN_URL: ${{ inputs.TOOLCHAIN_URL }}
      run: bash ./build.sh --fetch-toolchains

    - name: Build Kernel
      if: inputs.UPDATE_TOOLCHAIN != 'true'
      env:
        DEVICE_TARGET: ${{ inputs.DEVICE_TARGET }}
        APPLY_WORKAROUND: ${{ inputs.APPLY_WORKAROUND }}
        KSU: ${{ inputs.KSU }}
        CI_ZIPNAME: "${{ steps.buildKernel.outputs.buildDetails }}.zip"
        KCFLAGS_W: "${{ inputs.KCFLAGS_W }}"
        TOOLCHAIN_URL: "${{ inputs.TOOLCHAIN_URL }}"
        CCACHE_SIZE: "${{ inputs.CCACHE_SIZE }}"
        CLEAN_BUILD: "${{ inputs.CLEAN_BUILD }}"
      run: |
        cd kernel_root
        if [ ! -d ~/.ccache ]; then
          mkdir -p ~/.ccache
        fi
        if [[ "$KSU" == "true" ]]; then
          curl -LSs "https://raw.githubusercontent.com/rsuntk/KernelSU/main/kernel/setup.sh" | bash -s ${{ inputs.KSU_BRANCH }}
        fi
        bash ../build.sh

    - name: Upload kernel artifacts
      uses: actions/upload-artifact@v5
      with:
        name: Kernel-${{ steps.buildKernel.outputs.buildDetails }}
        path: |
          kernel_root/*.zip
          kernel_root/out/.config

    - name: Upload to GitHub Release
      if: inputs.UPLOAD_RELEASE == 'true' && inputs.UPDATE_TOOLCHAIN != 'true'
      uses: softprops/action-gh-release@v2
      with:
        files: kernel_root/${{ steps.buildKernel.outputs.buildDetails }}.zip
        tag_name: ${{ steps.buildKernel.outputs.buildDetails }}
        name: Kernel ${{ steps.buildKernel.outputs.buildDetails }}
        draft: false
        prerelease: ${{ inputs.BUILD_RELEASE == 'false' }}
